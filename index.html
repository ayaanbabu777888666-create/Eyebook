<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020e09">
<meta name="description" content="EyeBook — Connect with the World">

<title>EyeBook — Fully Real Social Platform</title>

<!-- PWA Manifest & Web App Setup -->
<link rel="manifest" href='data:application/manifest+json,{
  "name": "EyeBook",
  "short_name": "EyeBook",
  "start_url": "./",
  "display": "standalone",
  "background_color": "#020e09",
  "theme_color": "#020e09",
  "icons": [{
    "src": "https://img.icons8.com/color/192/visible--v1.png",
    "sizes": "192x192",
    "type": "image/png"
  }]
}'>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --bg-dark:#020e09;
  --bg-card:#061a12;
  --bg-surface:#0c281c;
  --primary:#00e676;
  --text-main:#f0fff8;
  --text-muted:#80a894;
  --border-color:#133b2a;
  --danger:#ff5252;
}

*{box-sizing:border-box;outline:none;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg-dark);color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}

#appRoot{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:radial-gradient(circle at top,#093322 0%,#020e09 70%);overflow-x:hidden;padding-bottom:65px;}

.hidden{display:none !important;}
.btn-primary{background:linear-gradient(135deg,var(--primary),#00b0ff);color:#020e09;font-weight:700;border:none;border-radius:25px;padding:12px 24px;width:100%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary);font-weight:700;border-radius:25px;padding:12px 24px;width:100%;cursor:pointer;font-size:15px;}
.btn-secondary{background:var(--bg-surface);border:1px solid var(--border-color);color:var(--text-main);font-weight:600;border-radius:12px;padding:8px 16px;cursor:pointer;font-size:13px;}

/* Header UI */
.app-header{position:sticky;top:0;z-index:40;background:rgba(2,14,9,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-color);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.brand-logo{display:flex;align-items:center;gap:8px;cursor:pointer;}
.eye-icon-svg{width:32px;height:24px;fill:none;stroke:var(--primary);stroke-width:3;}
.brand-title{font-size:20px;font-weight:900;letter-spacing:-0.5px;color:var(--text-main);}
.brand-title span{color:var(--primary);}

@media all and (display-mode: standalone) {
  #apkDownloadBtn { display: none !important; }
}

/* Stories Scroll Bar */
.stories-wrapper{padding:12px 16px;display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;}
.stories-wrapper::-webkit-scrollbar{display:none;}
.story-node{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex-shrink:0;}
.story-ring{width:64px;height:64px;border-radius:50%;padding:2px;background:var(--border-color);position:relative;}
.story-ring.has-story{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);}
.story-img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg-dark);background:var(--bg-card);}
.story-add-icon{position:absolute;bottom:0;right:0;background:var(--primary);color:#000;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:bold;font-size:14px;border:2px solid var(--bg-dark);}
.story-label{font-size:11px;color:var(--text-muted);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Bottom Navigation */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(4,20,13,0.96);backdrop-filter:blur(15px);border-top:1px solid var(--border-color);display:flex;justify-content:space-around;align-items:center;padding:8px 0;z-index:50;}
.nav-item{background:none;border:none;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;cursor:pointer;}
.nav-item.active{color:var(--primary);}
.nav-item svg{width:24px;height:24px;fill:currentColor;}
.nav-dp-ring{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--text-muted);overflow:hidden;background:var(--bg-card);}
.nav-item.active .nav-dp-ring{border-color:var(--primary);box-shadow:0 0 8px rgba(0,230,118,0.5);}
.nav-dp-ring img{width:100%;height:100%;object-fit:cover;}

.full-screen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:var(--bg-dark);overflow-y:auto;max-width:480px;margin:0 auto;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-color);}

/* Feed Cards */
.post-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;margin:0 12px 16px;overflow:hidden;}
.post-header{padding:12px;display:flex;align-items:center;justify-content:space-between;}
.post-user{display:flex;align-items:center;gap:10px;}
.post-user-img{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.post-img{width:100%;max-height:450px;object-fit:cover;display:block;}
.post-actions{display:flex;gap:16px;padding:10px 12px;}
.post-actions svg{width:22px;height:22px;fill:none;stroke:var(--text-main);stroke-width:2;cursor:pointer;}
.post-actions svg.liked{fill:var(--danger);stroke:var(--danger);}

/* Profile Layout */
.profile-head{padding:16px;}
.profile-main-info{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.profile-dp-large{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--primary);padding:2px;background:var(--bg-card);}
.profile-stats{display:flex;gap:20px;text-align:center;}
.stat-val{font-size:16px;font-weight:800;display:block;color:var(--text-main);}
.stat-lbl{font-size:12px;color:var(--text-muted);}

.input-field{width:100%;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:12px;padding:12px 14px;color:var(--text-main);font-size:14px;margin-bottom:12px;}

/* Live Camera Filters UI */
.filter-btn-bar{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none;}
.filter-chip{background:var(--bg-surface);border:1px solid var(--border-color);color:var(--text-main);padding:6px 14px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer;}
.filter-chip.active{background:var(--primary);color:#020e09;font-weight:bold;}

/* Live Messaging Chat Window */
.chat-msg-row{display:flex;flex-direction:column;margin-bottom:10px;}
.chat-msg-row.sent{align-items:flex-end;}
.chat-msg-row.received{align-items:flex-start;}
.chat-bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;}
.chat-msg-row.sent .chat-bubble{background:var(--primary);color:#020e09;border-bottom-right-radius:2px;}
.chat-msg-row.received .chat-bubble{background:var(--bg-surface);border:1px solid var(--border-color);color:var(--text-main);border-bottom-left-radius:2px;}
</style>
</head>

<body>

<div id="appRoot">

  <!-- Header -->
  <header class="app-header">
    <div class="brand-logo" id="brandHomeBtn">
      <svg class="eye-icon-svg" viewBox="0 0 100 70">
        <defs>
          <linearGradient id="gEye" x1="0" x2="1" y1="0" y2="1">

        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
    </div>
  </header>

  <!-- Welcome / Auth Screen -->
  <section id="welcomeScreen" class="full-screen" style="z-index:90;display:flex;flex-direction:column;justify-content:space-between;padding:40px 24px;text-align:center;">
    <div style="margin-top:40px;">
      <svg class="eye-icon-svg" style="width:90px;height:70px;" viewBox="0 0 100 70">
        <path d="M5 35 Q50 -8 95 35 Q50 78 5 35Z" stroke="var(--primary)" stroke-width="6" fill="#061a12"/>
        <circle cx="50" cy="35" r="18" fill="var(--primary)"/>
        <circle cx="50" cy="35" r="8" fill="#020e09"/>
      </svg>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <button class="btn-primary" id="btnAuthPhone">Continue with Mobile</button>
      <button class="btn-outline" id="btnAuthGoogle">Continue with Google</button>

  <!-- Phone Login Modal -->
  <div id="phoneLoginModal" class="full-screen hidden" style="z-index:95;padding:24px;">
    <button class="btn-secondary" id="closePhoneModal" style="margin-bottom:20px;">← Back</button>

    <div style="display:flex;gap:8px;margin-bottom:12px;">

  </div>

  <!-- Main App Screen -->
  <main id="mainAppContent" class="hidden">
    <!-- Stories Bar -->
    <div class="stories-wrapper" id="storiesBar">
      <div class="story-node" id="triggerStoryModal">
        <div class="story-ring">
          <img src="https://via.placeholder.com/64" class="story-img" id="myStoryThumb">

        </div>
        <span class="story-label">Your story</span>
      </div>
    </div>

    <!-- Home Feed Tab -->
    <div id="tabHome" class="tab-page">
      <div id="postsContainer"><p style="text-align:center;color:var(--text-muted);padding:40px 0;">Loading posts...</p></div>
    </div>

    <!-- Reels Tab -->
    <div id="tabReels" class="tab-page hidden" style="padding:16px;text-align:center;">

      <button class="btn-primary" id="openReelModal" style="max-width:200px;margin:0 auto 16px;">+ Upload Reel</button>
      <div id="reelsContainer"></div>

    <!-- Real Direct Messages Tab -->

          <div class="profile-stats">
            <div><span class="stat-val" id="statPosts">0</span><span class="stat-lbl">posts</span></div>
            <div><span class="stat-val" id="statFollowers">0</span><span class="stat-lbl">followers</span></div>

  <!-- Navigation Bar (5 Icons) -->

    <button class="nav-item" data-target="tabProfile">
      <div class="nav-dp-ring"><img src="https://via.placeholder.com/26" id="navDpImg"></div>
    </button>
  </nav>

</div>

<!-- Studio Modal with LIVE Filter & Camera Effects -->
<div id="createModal" class="full-screen hidden" style="z-index:110;">
  <div class="modal-header">
    <span style="font-weight:700;">Studio — Post & Story Filter</span>
    <button class="btn-secondary" id="closeCreateModal">✕</button>
  </div>
  <div style="padding:16px;">
    
    <!-- Camera Preview with Live Filter Effects -->
    <div style="position:relative;width:100%;height:300px;background:#000;border-radius:14px;overflow:hidden;margin-bottom:12px;">
      <video id="cameraPreviewVideo" autoplay playsinline style="width:100%;height:100%;object-fit:cover;"></video>
      <canvas id="cameraCanvas" style="display:none;"></canvas>
    </div>

    <!-- Filters Carousel -->
    <label style="font-size:12px;color:var(--text-muted);">Real Filters & Effects:</label>
    <div class="filter-btn-bar" id="filterBar">
      <button class="filter-chip active" data-filter="none">Normal</button>
      <button class="filter-chip" data-filter="grayscale(100%)">B&W</button>
      <button class="filter-chip" data-filter="sepia(80%)">Vintage</button>
      <button class="filter-chip" data-filter="contrast(150%) brightness(110%)">Vivid</button>
      <button class="filter-chip" data-filter="hue-rotate(90deg)">Cyber</button>
      <button class="filter-chip" data-filter="blur(1px) brightness(120%)">Soft Glow</button>
    </div>

    <div style="display:flex;gap:10px;margin:12px 0;">
      <button class="btn-secondary" id="startCameraBtn" style="flex:1;">📷 Start Camera</button>
      <button class="btn-secondary" id="capturePicBtn" style="flex:1;">📸 Capture Photo</button>
    </div>

    <label style="font-size:12px;color:var(--text-muted);">Or Upload File:</label>
    <input type="file" id="mediaFile" accept="image/*,video/*" class="input-field">
    
    <textarea id="postCaption" class="input-field" placeholder="Write caption..." rows="2"></textarea>
    <input id="postSong" class="input-field" placeholder="🎵 Add Audio / Song">
    <input id="postTag" class="input-field" placeholder="👤 Tag people">

<!-- Real Chat Window Modal -->
<div id="chatRoomModal" class="full-screen hidden" style="z-index:120;display:flex;flex-direction:column;">
  <div class="modal-header">
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="btn-secondary" id="closeChatBtn" style="padding:4px 10px;">←</button>
      <strong id="chatPartnerName">Chat</strong>
    </div>
  </div>
  <div id="chatMessagesList" style="flex:1;padding:16px;overflow-y:auto;"></div>

    <input id="chatInputText" class="input-field" placeholder="Type message..." style="margin-bottom:0;">
    <button class="btn-primary" id="btnSendMsg" style="width:auto;padding:0 20px;">Send</button>
  </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="full-screen hidden" style="z-index:115;">
  <div class="modal-header">
    <span style="font-weight:700;">Settings and activity</span>
    <button class="btn-secondary" id="closeSettingsModal">✕</button>
  </div>
  <div style="padding:16px;">
    <input class="input-field" placeholder="Search settings..." style="margin-bottom:16px;">
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">Your account</div>
    <div style="padding:12px 0;border-bottom:1px solid var(--border-color);">Account Center</div>
    <button class="btn-primary" id="btnLogout" style="background:var(--danger);color:#fff;margin-top:30px;">Log out</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, RecaptchaVerifier, signInWithPhoneNumber, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot, getDocs, where } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyARJlmwpKVoEKmMLTy0ddDnE2lMQEKZKts",
  authDomain: "eyebook-7885f-78d46.firebaseapp.com",
  projectId: "eyebook-7885f-78d46",
  storageBucket: "eyebook-7885f-78d46.firebasestorage.app",
  messagingSenderId: "1059176010742",
  appId: "1:297441359052:web:3aa43bbd674731f6143e69"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser = null;
let userProfile = null;
let activeChatUserId = null;
let activeFilter = "none";
let capturedBlob = null;

const $ = id => document.getElementById(id);

// Tab Navigation
document.querySelectorAll(".nav-item[data-target]").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const target = btn.dataset.target;
    document.querySelectorAll(".tab-page").forEach(t => t.classList.add("hidden"));
    $(target).classList.remove("hidden");
    if(target === "tabMessages") loadUsersForChat();
  };
});

// Modals Setup
$("btnAuthPhone").onclick = () => $("phoneLoginModal").classList.remove("hidden");
$("closePhoneModal").onclick = () => $("phoneLoginModal").classList.add("hidden");
$("navCreateBtn").onclick = () => $("createModal").classList.remove("hidden");
$("closeCreateModal").onclick = () => $("createModal").classList.add("hidden");
$("triggerStoryModal").onclick = () => $("createModal").classList.remove("hidden");
$("openSettingsBtn").onclick = () => $("settingsModal").classList.remove("hidden");
$("closeSettingsModal").onclick = () => $("settingsModal").classList.add("hidden");
$("closeChatBtn").onclick = () => $("chatRoomModal").classList.add("hidden");

// Filter Chips Setup
document.querySelectorAll(".filter-chip").forEach(chip => {
  chip.onclick = () => {
    document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeFilter = chip.dataset.filter;
    $("cameraPreviewVideo").style.filter = activeFilter;
  };
});

// Real Camera Effects Stream
$("startCameraBtn").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    $("cameraPreviewVideo").srcObject = stream;
  } catch(e) { alert("Camera access denied or unavailable."); }
};

$("capturePicBtn").onclick = () => {
  const video = $("cameraPreviewVideo");
  const canvas = $("cameraCanvas");
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext("2d");
  ctx.filter = activeFilter;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => {
    capturedBlob = blob;
    alert("Photo captured with filter!");
  }, "image/jpeg");
};

// Real Chat / Direct Messages System
async function loadUsersForChat() {
  const usersSnap = await getDocs(collection(db, "users"));
  const container = $("usersListForChat");
  container.innerHTML = "";
  usersSnap.forEach(uDoc => {
    const u = uDoc.data();
    if(u.uid === currentUser.uid) return;
    const div = document.createElement("div");
    div.style.cssText = "display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border-color);cursor:pointer;";
    div.innerHTML = `
      <img src="${u.dpUrl || 'https://via.placeholder.com/40'}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
      <div>
        <strong>${u.name}</strong>
        <div style="font-size:12px;color:var(--text-muted);">@${u.username}</div>
      </div>
    `;
    div.onclick = () => openChatRoom(u);
    container.appendChild(div);
  });
}

function openChatRoom(partner) {
  activeChatUserId = partner.uid;
  $("chatPartnerName").textContent = partner.name;
  $("chatRoomModal").classList.remove("hidden");
  loadMessages();
}

function loadMessages() {
  const chatId = [currentUser.uid, activeChatUserId].sort().join("_");
  onSnapshot(query(collection(db, `chats/${chatId}/messages`), orderBy("createdAt", "asc")), snap => {
    const list = $("chatMessagesList");
    list.innerHTML = "";
    snap.forEach(mDoc => {
      const m = mDoc.data();
      const isMe = m.senderId === currentUser.uid;
      const row = document.createElement("div");
      row.className = `chat-msg-row ${isMe ? 'sent' : 'received'}`;
      row.innerHTML = `<div class="chat-bubble">${m.text}</div>`;
      list.appendChild(row);
    });
    list.scrollTop = list.scrollHeight;
  });
}

$("btnSendMsg").onclick = async () => {
  const text = $("chatInputText").value.trim();
  if(!text || !activeChatUserId) return;
  const chatId = [currentUser.uid, activeChatUserId].sort().join("_");
  await addDoc(collection(db, `chats/${chatId}/messages`), {
    senderId: currentUser.uid,
    text,
    createdAt: new Date()
  });
  $("chatInputText").value = "";
};

// Auth Watcher
onAuthStateChanged(auth, async user => {
  currentUser = user;
  if(user) {
    $("welcomeScreen").classList.add("hidden");
    const docSnap = await getDoc(doc(db, "users", user.uid));
    if(docSnap.exists()) {
      userProfile = docSnap.data();
      $("mainAppContent").classList.remove("hidden");
      $("bottomNavContainer").style.display = "flex";
      loadFeed();
    }
  } else {
    $("welcomeScreen").classList.remove("hidden");
    $("mainAppContent").classList.add("hidden");
  }
});

function loadFeed() {
  onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), snap => {
    const feed = $("postsContainer");
    feed.innerHTML = snap.empty ? "<p style='text-align:center;color:var(--text-muted);padding:40px 0;'>No posts yet.</p>" : "";
    snap.forEach(d => {
      const p = d.data();
      const card = document.createElement("div");
      card.className = "post-card";
      card.innerHTML = `
        <div class="post-header">
          <div class="post-user">
            <img src="${p.dpUrl || 'https://via.placeholder.com/36'}" class="post-user-img">
            <strong>${p.name}</strong>
          </div>
        </div>
        <img src="${p.mediaUrl}" class="post-img">
        <div class="post-body">
          <p>${p.caption || ""}</p>
        </div>
      `;
      feed.appendChild(card);
    });
  });
}

$("btnLogout").onclick = () => signOut(auth);
</script>
</body>
</html>
